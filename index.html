
   <!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Portal educativo de filosofía. No recopila datos personales ni realiza descargas." />
  <title>Filosofía – Portal de Cursos</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1e1e2f, #3a0f5c, #0f4c5c);
      background-size: 400% 400%;
      animation: fondo 12s ease infinite;
      color: white;
      overflow-x: hidden;
    }

    @keyframes fondo {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    canvas { position: fixed; inset: 0; z-index: 0; }

    .page {
      position: relative;
      z-index: 1;
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem 1rem 7rem;
      text-align: center;
    }

    h1 { font-size: clamp(2rem, 6vw, 3rem); margin-bottom: 1rem; }
    p { margin-bottom: 2.5rem; font-size: 1rem; opacity: 0.85; }

    .botones { display: flex; flex-wrap: wrap; gap: 1.5rem; justify-content: center; }

    .card { width: 90%; max-width: 260px; height: 180px; perspective: 1000px; }

    .card-inner {
      width: 100%; height: 100%; transition: transform 0.6s;
      transform-style: preserve-3d; cursor: pointer;
    }

    .card.activa .card-inner { transform: rotateY(180deg); }

    .card-front, .card-back {
      position: absolute; width: 100%; height: 100%;
      border-radius: 20px; display: flex; align-items: center; justify-content: center;
      backface-visibility: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      padding: 1rem; text-align: center;
    }

    .card-front { font-size: 1.6rem; font-weight: bold; }
    .card-back { transform: rotateY(180deg); font-size: 1.1rem; }

    .cuarto { background: linear-gradient(135deg, #ff6b6b, #c73866); }
    .quinto { background: linear-gradient(135deg, #feca57, #ff9f43); color: #1e1e2f; }
    .sexto { background: linear-gradient(135deg, #1dd1a1, #10ac84); }

    .barra-bienvenida {
      margin-top: 3rem; padding: 1rem; font-size: 1rem;
      background: rgba(0,0,0,0.3);
      border-radius: 10px;
    }

    footer {
      margin-top: 2rem;
      font-size: 0.8rem;
      opacity: 0.7;
    }
  </style>
</head>

<body>
<canvas id="filosofia"></canvas>

<div class="page">
  <h1>Filosofía</h1>
  <p>Elegí tu curso y accedé al contenido educativo</p>

  <div class="botones">

    <div class="card" data-url="https://sites.google.com/view/filosofante/inicio">
      <div class="card-inner">
        <div class="card-front cuarto">4º Año</div>
        <div class="card-back cuarto">Introducción al pensamiento filosófico</div>
      </div>
    </div>

    <div class="card" data-url="https://sites.google.com/view/quintofilosofia/inicio?authuser=2">
      <div class="card-inner">
        <div class="card-front quinto">5º Año</div>
        <div class="card-back quinto">Conocimiento, ciencia y verdad</div>
      </div>
    </div>

    <div class="card" data-url="https://sites.google.com/view/filosexto/inicio">
      <div class="card-inner">
        <div class="card-front sexto">6º Año</div>
        <div class="card-back sexto">Ética y filosofía contemporánea</div>
      </div>
    </div>

  </div>

  <div class="barra-bienvenida">Portal educativo – No se solicitan datos personales</div>

  <footer>
    Sitio educativo sin fines comerciales | Proyecto docente
  </footer>
</div>

<script>
  // navegación segura sin onclick inline
  document.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', () => {
      const url = card.getAttribute('data-url');
      window.location.assign(url);
    });
  });

  const canvas = document.getElementById('filosofia');
  const ctx = canvas.getContext('2d');
  let w, h;

  function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }

  window.addEventListener('resize', resize);
  resize();

  const particulas = Array.from({ length: 50 }, () => ({
    x: Math.random() * w,
    y: Math.random() * h,
    r: Math.random() * 2 + 1,
    vx: (Math.random() - 0.5) * 0.4,
    vy: (Math.random() - 0.5) * 0.4
  }));

  function animar() {
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = 'rgba(255,255,255,0.5)';

    particulas.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;

      if (p.x < 0 || p.x > w) p.vx *= -1;
      if (p.y < 0 || p.y > h) p.vy *= -1;

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    });

    requestAnimationFrame(animar);
  }

  animar();
</script>

</body>
</html>
